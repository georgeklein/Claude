[package]
name = "creator-amm-v2"
version = "2.0.0"
description = "Advanced bonding curve AMM with dynamic virtual liquidity and dual-phase curves"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "creator_amm_v2"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
solana-program = "1.17"

[dev-dependencies]
solana-program-test = "1.17"
solana-sdk = "1.17"
spl-token = "4.0"
