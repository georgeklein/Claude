[package]
name = "creator-amm-v2"
version = "2.0.0"
description = "Advanced bonding curve AMM with dynamic virtual liquidity and dual-phase curves"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "creator_amm_v2"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "1.18"

# Optional: For standard Pyth Network integration (if not using custom oracle)
# pyth-solana-receiver-sdk = "0.2"
# If using standard Pyth, uncomment above and update oracle.rs PythPriceFeed struct

[dev-dependencies]
solana-program-test = "1.18"
solana-sdk = "1.18"
spl-token = "4.0"
