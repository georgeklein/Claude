# Scale AMM - Rust Workspace Configuration
#
# Optimized release profile with overflow checks and LTO for production security

[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
