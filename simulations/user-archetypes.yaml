# Scale AMM User Archetypes
# Based on behavioral analysis from Pump.fun, Meteora, and DeFi research
# Generated: 2026-01-08

traders:
  # Retail trader - Most common user
  - name: "Retail Trader"
    description: "Average crypto trader, moderate risk tolerance"
    percentage_of_users: 0.60  # 60% of user base
    avg_trade_size_crx: 100
    trade_frequency_per_day: 2
    hold_duration_hours: 24
    snipe_attempts: "none"
    research_depth: "medium"  # Reads docs, checks socials
    slippage_tolerance_pct: 5
    risk_tolerance: "medium"
    preferred_tokens: "established"  # Waits for social proof
    sell_trigger: "10% profit or -20% loss"

  # Degen flipper - High frequency trader
  - name: "Degen Flipper"
    description: "High-frequency trader, chases pumps, quick exits"
    percentage_of_users: 0.25  # 25% of user base
    avg_trade_size_crx: 1000
    trade_frequency_per_day: 20
    hold_duration_hours: 0.1  # 6 minutes average
    snipe_attempts: "high"
    research_depth: "low"  # FOMO trading
    slippage_tolerance_pct: 10
    risk_tolerance: "very_high"
    preferred_tokens: "new_launches"  # First 10 minutes
    sell_trigger: "3% profit or immediate exit on dump"
    waa_penalty_impact: "high"  # WAA anti-sniper targets this archetype

  # Whale - Large capital holder
  - name: "Whale"
    description: "Large capital holder, moves markets"
    percentage_of_users: 0.05  # 5% of user base
    avg_trade_size_crx: 50000
    trade_frequency_per_day: 5
    hold_duration_hours: 1
    snipe_attempts: "medium"
    research_depth: "high"  # Due diligence before large trades
    slippage_tolerance_pct: 3
    risk_tolerance: "medium"
    preferred_tokens: "high_liquidity"
    sell_trigger: "Strategic exits, not panic selling"
    anti_sniper_limit_impact: "medium"  # 5% trade size limit affects whales

  # Bot operator - MEV/arbitrage
  - name: "Bot Operator"
    description: "Automated trading, MEV, arbitrage"
    percentage_of_users: 0.05  # 5% of user base
    avg_trade_size_crx: 500
    trade_frequency_per_day: 100
    hold_duration_hours: 0.01  # Seconds to minutes
    snipe_attempts: "very_high"
    research_depth: "algorithmic"  # No human research
    slippage_tolerance_pct: 1
    risk_tolerance: "calculated"  # Risk-adjusted strategies
    preferred_tokens: "all"  # Scans all pools
    sell_trigger: "Algorithmic (arbitrage, MEV)"
    waa_penalty_impact: "critical"  # WAA makes bot trading unprofitable
    anti_sniper_limit_impact: "critical"  # Size limits block large bot trades

  # Long-term holder - Conviction investor
  - name: "Long-Term Holder"
    description: "Conviction investor, low time preference"
    percentage_of_users: 0.05  # 5% of user base
    avg_trade_size_crx: 500
    trade_frequency_per_day: 0.1  # One trade per 10 days
    hold_duration_hours: 720  # 30 days average
    snipe_attempts: "none"
    research_depth: "very_high"  # Deep fundamental research
    slippage_tolerance_pct: 2
    risk_tolerance: "low"
    preferred_tokens: "quality_projects"
    sell_trigger: "Fundamental change or target reached"
    waa_penalty_impact: "none"  # Holds past WAA window

# Creator archetypes (token launchers)
creators:
  # Serious project - Real utility token
  - name: "Serious Project"
    description: "Real utility token, long-term vision"
    percentage_of_creators: 0.10  # 10% of launches
    initial_mcap_target_usd: 10000
    graduation_expectation: "high"  # 90% expect to graduate
    marketing_budget_usd: 5000
    team_size: 5
    token_utility: "high"  # Real use case
    liquidity_provision: "commits to adding post-graduation"
    success_rate: 0.8  # 80% actually graduate

  # Meme launcher - Fun/community token
  - name: "Meme Launcher"
    description: "Meme token, community-driven"
    percentage_of_creators: 0.40  # 40% of launches
    initial_mcap_target_usd: 5000
    graduation_expectation: "medium"  # 50% expect to graduate
    marketing_budget_usd: 1000
    team_size: 2
    token_utility: "low"  # Meme value only
    liquidity_provision: "uncertain"
    success_rate: 0.5  # 50% graduate

  # Scam/rug - Malicious actor
  - name: "Scam/Rug"
    description: "Malicious actor, pump and dump"
    percentage_of_creators: 0.30  # 30% of launches (Pump.fun data)
    initial_mcap_target_usd: 2000
    graduation_expectation: "none"  # Just pump and dump
    marketing_budget_usd: 500
    team_size: 1
    token_utility: "none"
    liquidity_provision: "none"
    success_rate: 0.0  # Don't graduate, exit before
    waa_impact: "blocks early rug pulls"

  # Test launch - Developer testing
  - name: "Test Launch"
    description: "Developer testing, not serious"
    percentage_of_creators: 0.20  # 20% of launches
    initial_mcap_target_usd: 1000
    graduation_expectation: "none"
    marketing_budget_usd: 0
    team_size: 1
    token_utility: "none"
    liquidity_provision: "none"
    success_rate: 0.0

# Behavioral patterns (time-based)
behavioral_patterns:
  launch_timing:
    peak_hours_utc: [14, 15, 16, 17, 18]  # 2-6 PM UTC (US trading hours)
    weekend_multiplier: 1.5  # 50% more launches on weekends

  trading_patterns:
    first_10_minutes: "60% of total volume"
    first_hour: "85% of total volume"
    first_24_hours: "95% of total volume"

  sniper_patterns:
    snipe_attempts_per_launch: 20  # Average 20 snipe attempts
    snipe_success_rate_without_waa: 0.8  # 80% successful without protection
    snipe_success_rate_with_waa: 0.2  # 20% successful with WAA (penalty makes it unprofitable)

# Economic impact analysis
economic_impact:
  crx_demand:
    per_launch_avg_crx: 1000  # Average 1000 CRX locked per pool
    launches_per_day: 50
    daily_crx_demand: 50000  # 50k CRX per day

  crx_supply_shock:
    graduated_pools_lock_crx: true  # CRX trapped in graduated pools
    deflationary_pressure: "high"

  protocol_revenue:
    avg_fee_per_trade_crx: 1  # 1% of avg 100 CRX trade
    trades_per_day: 10000  # Across all pools
    daily_protocol_revenue_crx: 10000  # 10k CRX per day
    daily_protocol_revenue_usd: 20000  # At $2/CRX
    monthly_revenue_usd: 600000  # $600k/month
    annual_revenue_usd: 7200000  # $7.2M/year

# Comparison to Pump.fun
pumpfun_comparison:
  pumpfun_launches_per_day: 1000
  pumpfun_graduation_rate: 0.03
  pumpfun_avg_hold_time_minutes: 15

  scale_amm_launches_per_day: 50  # More selective due to CRX requirement
  scale_amm_graduation_rate: 0.60  # 20x better than Pump.fun
  scale_amm_avg_hold_time_hours: 24  # 96x longer hold time

  quality_difference: "Scale AMM filters out low-quality launches via CRX requirement and WAA anti-sniper"
