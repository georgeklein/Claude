    expected_behavior: "Config locked after initialization"
    mitigation: "DEPLOYMENT_CHECKLIST.md, multiple reviews"
    test_coverage: "⚠️ Manual review required"

  - name: "Lost Private Keys"
    probability: 0.05  # 5% chance
