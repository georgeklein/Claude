# Scale AMM Risk Scenarios
# Comprehensive risk analysis and failure mode testing
# Generated: 2026-01-08

# CRITICAL RISKS - Could brick protocol
critical_risks:
  - name: "Oracle Downtime"
    probability: 0.01  # 1% chance per day
    severity: "critical"
    duration_minutes: 5
    trigger: "Pyth network outage or oracle account issues"
    impact: "All trades halt (cannot calculate virtual reserves)"
    expected_behavior: "Transactions revert with OraclePriceStale error"
    mitigation: "60-second staleness tolerance, fallback oracle (future)"
    test_coverage: "✅ Covered in critical-coverage.ts"

  - name: "CRX Price Oracle Manipulation"
    probability: 0.001  # 0.1% chance (requires large capital)
    severity: "critical"
    attack_vector: "Manipulate CRX/SOL pool to affect oracle price"
    impact: "Virtual reserves miscalculated, potential exploit"
    expected_behavior: "Confidence check rejects manipulated price"
    mitigation: "1% max confidence requirement, TWAP consideration (future)"
    test_coverage: "✅ Covered in critical-coverage.ts (confidence validation)"

  - name: "DEPLOYER_PUBKEY Front-Running"
    probability: 1.0  # 100% if not fixed before deploy
    severity: "catastrophic"
    trigger: "Deploy to mainnet with placeholder DEPLOYER_PUBKEY"
    impact: "Anyone can initialize protocol and become authority"
    expected_behavior: "Attacker calls initialize(), controls protocol"
    mitigation: "UPDATE DEPLOYER_PUBKEY BEFORE DEPLOY"
    test_coverage: "⚠️ Manual check required"
    status: "🔴 BLOCKER - MUST FIX"

  - name: "Reentrancy Attack"
    probability: 0.001  # Low due to Anchor's protections
    severity: "critical"
    attack_vector: "Recursive call during token transfer"
    impact: "Drain vault or manipulate reserves"
    expected_behavior: "Anchor account constraints prevent reentrancy"
    mitigation: "Anchor built-in protections + post-trade validation"
    test_coverage: "✅ Covered in security-tests.ts"

  - name: "Integer Overflow/Underflow"
    probability: 0.01  # 1% if not using checked arithmetic
    severity: "critical"
    attack_vector: "Craft trades to cause overflow in calculations"
    impact: "Incorrect amounts, potential vault drain"
    expected_behavior: "Checked arithmetic reverts on overflow"
    mitigation: "All arithmetic uses checked_mul, checked_div, checked_add"
    test_coverage: "✅ Covered in graduation-overflow-tests.ts"

# HIGH RISKS - Significant impact but recoverable
high_risks:
  - name: "CRX Price Crash (90% drop)"
    probability: 0.05  # 5% chance in volatile market
    severity: "high"
    trigger: "Market panic, major exploit elsewhere, macro crash"
    impact: "Virtual reserves drop 90%, higher CRX cost for same USD mcap"
    expected_behavior: "Pools remain functional, USD thresholds stay constant"
    mitigation: "Oracle adjusts virtual reserves automatically"
    test_coverage: "✅ Covered in edge-cases-final.ts (extreme price)"
    scenario_simulation: "scenarios.yaml - Extreme Volatility"

  - name: "Network Congestion (400k CU limit)"
    probability: 0.10  # 10% during peak times
    severity: "high"
    trigger: "Solana network congestion, NFT mint, airdrop"
    impact: "Transactions fail if >400k CU (ours: 66-77k)"
    expected_behavior: "Transactions complete successfully"
    mitigation: "Current CU usage well below limit, optimize to <50k"
    test_coverage: "⚠️ Manual devnet testing required"
    current_status: "✅ Safe (66-77k CU < 400k limit)"

  - name: "Simultaneous Graduations (Race Condition)"
    probability: 0.05  # 5% during viral launches
    severity: "high"
    trigger: "Multiple pools hit graduation threshold in same slot"
    impact: "Potential race condition in vault transfers"
    expected_behavior: "Each graduation processes independently via Solana account locking"
    mitigation: "Solana account locking prevents race conditions"
    test_coverage: "✅ Covered in critical-coverage.ts (concurrent trading)"

  - name: "Whale Dumps (50% of Supply Sold)"
    probability: 0.15  # 15% per pool
    severity: "high"
    trigger: "Early buyer dumps entire position"
    impact: "Price crashes, other holders panic sell"
    expected_behavior: "WAA penalty makes early dump unprofitable"
    mitigation: "WAA anti-sniper: 10% sell fee in first 100 slots"
    test_coverage: "✅ Covered in critical-coverage.ts (WAA tests)"

  - name: "Flash Loan Attack"
    probability: 0.01  # 1% chance
    severity: "high"
    attack_vector: "Borrow CRX, manipulate pool, repay in same transaction"
    impact: "Price manipulation, sandwich attacks"
    expected_behavior: "Anti-sniper limits prevent large single trades"
    mitigation: "5% max trade size in first 100 slots"
    test_coverage: "✅ Covered in security-tests.ts"

  - name: "Sandwich Attack"
    probability: 0.20  # 20% of trades in competitive environment
    severity: "medium-high"
    attack_vector: "Front-run user trade, extract value via slippage"
    impact: "Users get worse prices"
    expected_behavior: "Slippage protection reverts trades beyond tolerance"
    mitigation: "User-defined slippage limits"
    test_coverage: "✅ Covered in security-tests.ts"

# MEDIUM RISKS - Manageable impact
medium_risks:
  - name: "Oracle Exponent Out of Bounds"
    probability: 0.001  # Very rare
    severity: "medium"
    trigger: "Oracle reports price with extreme exponent"
    impact: "Price calculation overflow/underflow"
    expected_behavior: "Exponent bounds check (-12 to 6) rejects"
    mitigation: "Exponent validation in oracle.rs"
    test_coverage: "✅ Covered in critical-coverage.ts"

  - name: "Dust Attack (Minimum Output Spam)"
    probability: 0.10  # 10% chance
    severity: "medium"
    attack_vector: "Many tiny trades to spam events/fill accounts"
    impact: "Event spam, account bloat"
    expected_behavior: "Minimum output check (1000 lamports) prevents dust"
    mitigation: "validate_minimum_output() in trade.rs"
    test_coverage: "✅ Covered in edge-cases-final.ts"

  - name: "Slippage Bypass Attempt"
    probability: 0.05  # 5% chance
    severity: "medium"
    attack_vector: "Craft trade to bypass slippage check"
    impact: "User gets worse price than expected"
    expected_behavior: "validate_slippage() enforces limits"
    mitigation: "Strict slippage validation before transfer"
    test_coverage: "✅ Covered in security-tests.ts"

  - name: "Fee Calculation Manipulation"
    probability: 0.01  # 1% chance
    severity: "medium"
    attack_vector: "Craft trade to minimize fees paid"
    impact: "Protocol revenue loss"
    expected_behavior: "Fee calculation validated in tests"
    mitigation: "Checked arithmetic, comprehensive fee tests"
    test_coverage: "✅ Covered in advanced-coverage.ts"

