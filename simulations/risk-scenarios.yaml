    test_coverage: "⚠️ Manual verification required"

# ATTACK SCENARIO DETAILS
attack_scenarios:
  sandwich_attack:
    description: "Attacker front-runs user trade to extract value"
    steps:
      1. "Attacker monitors mempool for user's buy transaction"
      2. "Attacker submits buy (higher priority fee) to increase price"
      3. "User's buy executes at higher price"
      4. "Attacker immediately sells for profit"
    prevention: "Slippage limits + anti-sniper limits (5% max trade size)"
    test_result: "✅ BLOCKED - slippage validation catches this"

  flash_loan_attack:
    description: "Borrow CRX, manipulate pool, repay in same tx"
    steps:
      1. "Borrow 1M CRX via flash loan"
      2. "Buy tokens to drive price up"
      3. "Sell tokens at manipulated price"
      4. "Repay flash loan + profit"
    prevention: "Anti-sniper 5% max trade size makes this unprofitable"
    test_result: "✅ BLOCKED - trade size limit prevents manipulation"

  oracle_manipulation:
    description: "Manipulate CRX oracle to affect virtual reserves"
    steps:
      1. "Large buy/sell on CRX/SOL pool to move price"
      2. "Oracle updates to manipulated price"
      3. "Virtual reserves recalculated incorrectly"
      4. "Attacker exploits mispriced pools"
    prevention: "1% confidence limit rejects volatile prices"
    test_result: "✅ BLOCKED - confidence validation catches this"

  vault_drain_attack:
    description: "Exploit accounting bug to drain vault"
    steps:
      1. "Find rounding error or overflow in calculations"
      2. "Craft trade to exploit bug"
      3. "Repeat to drain vault"
    prevention: "Checked arithmetic + post-trade vault validation"
    test_result: "✅ BLOCKED - vault validation catches discrepancies"

  rug_pull:
    description: "Creator sells all tokens immediately after launch"
    steps:
      1. "Create pool with malicious intent"
      2. "Buy tokens at low price"
      3. "Market to attract buyers"
      4. "Sell all tokens immediately"
    prevention: "WAA anti-sniper makes early sells unprofitable (10% penalty)"
    test_result: "✅ MITIGATED - WAA penalty reduces rug pull profitability"

