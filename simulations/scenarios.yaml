# Scale AMM Economic Scenarios
# Based on competitor analysis (Pump.fun, Meteora, Raydium data)
# Generated: 2026-01-08

scenarios:
  # Baseline - Normal market conditions
  - name: "Normal Growth"
    description: "Typical market conditions with steady growth"
    crx_price_usd: 2.00
    crx_volatility_1hr: 0.05  # 5% hourly volatility
    token_launches_per_day: 50
    avg_creation_mcap_usd: 5000
    avg_graduation_mcap_usd: 85000
    graduation_rate: 0.6  # 60% of pools graduate
    typical_trade_size_crx: 100
    whale_trade_size_crx: 10000
    oracle_uptime: 0.999  # 99.9%
    network_congestion: "low"

  # Bull Market - High activity, high prices
  - name: "Bull Market Peak"
    description: "Peak bull market - high volume, high prices, many launches"
    crx_price_usd: 10.00
    crx_volatility_1hr: 0.15  # 15% hourly volatility
    token_launches_per_day: 500
    avg_creation_mcap_usd: 10000
    avg_graduation_mcap_usd: 85000  # Threshold is USD-stable
    graduation_rate: 0.9  # 90% graduate in bull market
    typical_trade_size_crx: 1000
    whale_trade_size_crx: 100000
    oracle_uptime: 0.999
    network_congestion: "high"

  # Bear Market - Low activity, low prices
  - name: "Bear Market Stress"
    description: "Bear market - low volume, low prices, few launches"
    crx_price_usd: 0.50
    crx_volatility_1hr: 0.10  # 10% hourly volatility
    token_launches_per_day: 10
    avg_creation_mcap_usd: 2500
    avg_graduation_mcap_usd: 85000  # Threshold stays same
    graduation_rate: 0.2  # Only 20% graduate
    typical_trade_size_crx: 50
    whale_trade_size_crx: 5000
    oracle_uptime: 0.995
    network_congestion: "low"

  # Extreme Volatility - Flash crash scenario
  - name: "Extreme Volatility"
    description: "Flash crash + recovery - tests oracle stability"
    crx_price_usd: 2.00
    crx_price_swing_1hr: -0.50  # 50% drop in 1 hour
    crx_recovery_24hr: 0.30  # 30% recovery in 24hr
    crx_volatility_1hr: 0.50  # 50% hourly volatility
    token_launches_per_day: 25
    avg_creation_mcap_usd: 5000
    avg_graduation_mcap_usd: 85000
    graduation_rate: 0.4
    typical_trade_size_crx: 100
    whale_trade_size_crx: 10000
    oracle_uptime: 0.99  # Slightly lower during volatility
    network_congestion: "extreme"
    flash_crash_probability: 0.1  # 10% chance of flash crash

  # High Volume - Pump.fun style viral launch
  - name: "Viral Launch Day"
    description: "Pump.fun style viral launch - extreme volume"
    crx_price_usd: 2.50
    crx_volatility_1hr: 0.08
    token_launches_per_day: 1000  # Viral day
    avg_creation_mcap_usd: 3000
    avg_graduation_mcap_usd: 85000
    graduation_rate: 0.5
    typical_trade_size_crx: 200
    whale_trade_size_crx: 50000
    concurrent_pools_active: 500
    trades_per_second_peak: 1000
    oracle_uptime: 0.999
    network_congestion: "extreme"

  # Post-Graduation - Meteora/Raydium competition
  - name: "Post-Graduation Competition"
    description: "Graduated pools competing with Meteora/Raydium"
    crx_price_usd: 3.00
    crx_volatility_1hr: 0.06
    graduated_pools_count: 1000
    total_tvl_graduated_usd: 10000000  # $10M TVL
    avg_pool_tvl_usd: 10000
    avg_24hr_volume_usd: 50000
    fee_competitiveness: "high"  # 1% vs Meteora 0.25%
    user_preference_scale_pct: 0.3  # 30% prefer Scale (oracle + virtual liquidity)
    user_preference_meteora_pct: 0.5  # 50% prefer Meteora (lower fees)
    user_preference_raydium_pct: 0.2  # 20% prefer Raydium (brand)

  # Stress Test - Maximum load
  - name: "Maximum Stress Test"
    description: "Absolute maximum load - stress test all systems"
    crx_price_usd: 2.00
    crx_volatility_1hr: 0.20
    token_launches_per_day: 2000
    concurrent_pools_active: 1000
    concurrent_graduations_per_minute: 10
    trades_per_second_peak: 2000
    avg_trade_size_crx: 500
    whale_trades_per_hour: 100
    oracle_queries_per_second: 5000
    network_congestion: "extreme"
    transaction_failure_rate: 0.1  # 10% fail due to congestion

# Real-World Benchmarks (from competitors)
benchmarks:
  pump_fun:
    graduation_threshold_usd: 69000  # Fixed $69k
    time_to_graduation_avg_minutes: 120  # 2 hours average
    graduation_rate: 0.03  # Only 3% graduate
    total_launches_to_date: 1000000  # 1M+ tokens launched

  meteora:
    tvl_usd: 50000000  # $50M TVL
    fee_tiers: [0.01, 0.25, 1.0]  # 0.01%, 0.25%, 1%
    avg_tps: 1000

  raydium:
    tvl_usd: 100000000  # $100M TVL
    avg_pool_creation_cost_usd: 50000  # High capital requirement
    avg_tps: 800

  orca:
    tvl_usd: 80000000  # $80M TVL
    fee_tiers: [0.01, 0.04, 0.3, 1.0]
    avg_tps: 1200

# Scale AMM Targets (based on competitive analysis)
targets:
  month_1_tvl_usd: 1000000  # $1M
  month_3_tvl_usd: 10000000  # $10M
  month_6_tvl_usd: 50000000  # $50M (match Meteora)
  month_12_tvl_usd: 100000000  # $100M (match Raydium)

  target_tps: 1000  # Match Meteora
  target_cu_per_trade: 50000  # <50k CU
  target_graduation_rate: 0.6  # 60% (vs Pump.fun 3%)

  fee_justification: "1% fees offset by oracle stability + virtual liquidity + WAA anti-sniper"
