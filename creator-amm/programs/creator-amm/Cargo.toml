[package]
name = "creator-amm"
version = "0.1.0"
description = "Virtual liquidity AMM for Creator platform"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "creator_amm"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
