[programs.devnet]
creator_amm_v2 = "CReamVLMa2dFi8RmKJQAYWn8Jy2yN5qvSu8gKFCxfp3"

[programs.mainnet]
creator_amm_v2 = "CReamVLMa2dFi8RmKJQAYWn8Jy2yN5qvSu8gKFCxfp3"

